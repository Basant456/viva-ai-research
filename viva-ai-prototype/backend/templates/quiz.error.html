<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verification Unavailable</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="page-header">
    <div class="header-badge">
        Conceptual Verification
    </div>

    <h1>Verification Quiz Unavailable</h1>

    <p>
        The system could not prepare verification questions for this submission.
    </p>
</div>

<div class="container">

    <div class="warning-box">
        {{ message }}
    </div>

    <p>
        Please return to the review page to inspect the analysis status and error details.
    </p>

    <a href="{{ url_for('review') }}" class="button-link">
        Back to Review
    </a>

    <a href="{{ url_for('index') }}" class="button-link">
        Back to Dashboard
    </a>

</div>

</body>

</html>
