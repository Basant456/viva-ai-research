<!DOCTYPE html>
<html>
<head>
    <title>Submission Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Submission Review Result</h1>

    <div class="card">
        <p><strong>Status:</strong> {{ risk.status }}</p>
        <p><strong>Reason:</strong> {{ risk.reason }}</p>

        <p><strong>Key Concepts:</strong></p>
        <ul>
            {% for concept in risk.key_concepts %}
                <li>{{ concept }}</li>
            {% endfor %}
        </ul>
    </div>

    {% if questions %}
        <a href="{{ url_for('quiz') }}" class="button-link">Start Verification Quiz</a>
    {% else %}
        <p>No verification quiz required.</p>
    {% endif %}
</div>
</body>
</html>
